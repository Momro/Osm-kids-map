name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper (if not committed)
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Welt-Entdecker-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Decode signing keystore (if secret set)
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > keystore.p12

      - name: Build signed Release APK (if secret set)
        if: env.KEYSTORE_BASE64 != ''
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK Artifact
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: Welt-Entdecker-Release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish GitHub Release – signierte APK (only on tags v*, keystore secret set)
        if: startsWith(github.ref, 'refs/tags/') && env.KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          name: Welt-Entdecker ${{ github.ref_name }} (signierte APK)
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

      - name: Publish GitHub Release – Debug-APK (only on tags v*, ohne keystore secret)
        if: startsWith(github.ref, 'refs/tags/') && env.KEYSTORE_BASE64 == ''
        uses: softprops/action-gh-release@v2
        with:
          name: Welt-Entdecker ${{ github.ref_name }} (Debug APK)
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
